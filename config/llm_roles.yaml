# ============================================================
# ZFLM - Configuration des rôles LLM
# ============================================================
# Cette configuration est lue par l'orchestrateur à chaque démarrage.
# Elle permet de changer provider / model / family SANS modifier
# le code Python.
#
# Trois rôles logiques :
#   - generator : produit le code du site
#   - reviewer  : analyse le code et propose des corrections
#                 (Phase 1.1 : Qwen 2.5 coder via Cloudflare)
#   - validator : valide ou refuse la tentative finale
#                 (Phase 1.1 : Qwen 3.6 via Groq)
#
# IMPORTANT :
#   - Le runtime appelle UNIQUEMENT FreeLLMAPI (projet tiers séparé).
#   - provider indique le provider attendu DERRIÈRE FreeLLMAPI,
#     principalement à des fins de logging/diagnostic. Le runtime
#     ZFLM ne contacte jamais Cloudflare ou Groq directement.
#   - Aucune cle API dans ce fichier. Aucun secret.
#   - OpenRouter ne fait PAS partie du runtime final.

roles:

  generator:
    provider: null
    model: null
    family: null

  reviewer:
    family: qwen2.5
    provider: cloudflare
    model: qwen2.5-coder-32b
    temperature: 0.2
    response_format: json_object
    context_window: 32768

  validator:
    family: qwen3
    provider: groq
    model: qwen3.6-27b
    temperature: 0.2
    response_format: json_object
    reasoning_effort: none
    context_window: 131072

# Notes :
# - temperature, response_format, reasoning_effort, context_window
#   sont des parametres transmis a FreeLLMAPI ; ils n'ont pas besoin
#   d'etre compris par ZFLM, juste transmis tels quels.
# - Pour changer de modele : editer ce fichier uniquement.
#   Aucun changement de code Python requis.